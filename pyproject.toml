[project]
name = "cron-ledger"
version = "1.0.0"
description = "oxzoo-live cron-ledger: Flask + gunicorn + Postgres with four idempotent cron jobs"
requires-python = ">=3.13,<3.14"
dependencies = [
    "flask>=3.0",
    "gunicorn>=23",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
